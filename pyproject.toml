[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plasticity-testbed"
version = "0.1.0"
description = "A supervised learning testbed for loss of plasticity"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "torchvision>=0.17", "numpy>=1.24", "PyYAML>=6", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
plasticity-testbed = "testbed.cli:main"

[tool.setuptools.packages.find]
include = ["testbed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "ANN"]
# YAML/checkpoint payloads and forwarded builder kwargs have heterogeneous values.
ignore = ["ANN401"]
