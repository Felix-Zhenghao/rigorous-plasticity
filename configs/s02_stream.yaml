# Field meanings and allowed values: docs/configuration.md.
# P17's EMNIST task cadence; replacement, architecture, and optimizer are explicit testbed choices.
paradigm: class_remap
data:
  dataset: emnist_balanced
  validation_fraction: 0
  normalization: unit_interval
  augmentation: none
  num_tasks: 2000
  pool_refresh: fixed
  task_samples: 2500
  chunk_size: 1
  epochs: 1
  sampling: with_replacement
  first_mapping: random
  stable_classes: []
model: {name: mlp, hidden_sizes: [100, 100], activation: relu}
method: {name: backprop}
optimizer: {name: sgd, lr: 0.01}
trainer:
  batch_size: 1
  lr_schedule: constant
  eval_splits: [test]
  eval_every_updates: 25000
  checkpoint_every_updates: 25000
seed: 0
device: cpu
data_root: ./data
output_dir: ./runs/s02_stream
