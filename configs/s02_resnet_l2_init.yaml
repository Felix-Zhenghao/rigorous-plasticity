# Field meanings and allowed values: docs/configuration.md.
# Repeated CIFAR-10 label remapping; fixed head and continuous clocks are testbed adaptations.
# L2 Init uses P08's fixed anchors; this ResNet recipe is not a P08 architecture reproduction.
paradigm: class_remap
data:
  dataset: cifar10
  validation_fraction: 0.1
  normalization: dataset_stats
  augmentation: none
  num_tasks: 100
  pool_refresh: fixed
  task_samples: pool
  chunk_size: task
  epochs: 10
  sampling: without_replacement
  first_mapping: random
  stable_classes: []
model:
  name: resnet_18
  stem: small
  base_channels: 64
  activation: relu
  norm: batch
  initialization: kaiming_uniform
method:
  name: l2_init
  coefficient: 0.0001  # Added loss: (coefficient / 2) * sum((p - p_at_initialization)**2).
  parameter_scope: network  # Whole model; "head" is the final output layer, "hidden" excludes it.
  include_bias: true  # Include selected biases, subject to the normalization filter below.
  include_norm_affine: false  # Exclude LayerNorm/BatchNorm learned gains and biases.
  include_embeddings: true  # Include embeddings and other parameters outside linear/conv/norm layers.
optimizer: {name: adam, lr: 0.001, weight_decay: 0}
trainer:
  batch_size: 250
  lr_schedule: constant
  eval_every_updates: 1000
  checkpoint_every_updates: 1000
seed: 0
device: cpu
data_root: ./data
output_dir: ./runs/s02_resnet_l2_init
