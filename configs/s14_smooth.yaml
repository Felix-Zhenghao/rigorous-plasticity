# Field meanings and allowed values: docs/configuration.md.
# P02's 500 * 390 minibatches of independent draws. Exponential endpoint convention: docs/data_notes.md.
paradigm: class_incremental
data:
  dataset: cifar10
  validation_fraction: 0
  normalization: unit_interval
  augmentation: none
  progression: examples
  stage_sizes: [0.5, 1.0]
  arrival_order: iid
  transition: [abrupt, exponential]
  transition_chunks: [1, 195000]
  transition_gamma: 0.99
  task_samples: [pool, 24960000]
  chunk_size: [task, 128]
  epochs: [null, 1]
  updates: [0, null]
  sampling: with_replacement
model: {name: resnet_18, stem: small}
method: {name: backprop}
optimizer: {name: adam, lr: 0.001}
trainer:
  batch_size: 128
  lr_schedule: constant
  eval_splits: [test]
  eval_every_updates: 3900
  checkpoint_every_updates: 3900
seed: 0
device: cpu
data_root: ./data
output_dir: ./runs/s14_smooth
